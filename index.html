<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>中考加油花坊</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #f5f5f7;
      --card: rgba(255,255,255,0.82);
      --card-border: rgba(255,255,255,0.9);
      --text: #1d1d1f;
      --text-secondary: #86868b;
      --accent: #0071e3;
      --accent-hover: #0077ed;
      --green: #34c759;
      --gold: #e8a317;
      --radius: 14px;
      --radius-lg: 20px;
      --shadow: 0 2px 24px rgba(0,0,0,0.04), 0 1px 4px rgba(0,0,0,0.02);
      --shadow-hover: 0 4px 36px rgba(0,0,0,0.08);
    }
    body {
      font-family: -apple-system, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', 'PingFang SC', sans-serif;
      background: #1a1a1e;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
    }

    /* ===== 全屏视频背景 ===== */
    #bgVideoWrap {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      overflow: hidden; z-index: 0;
    }
    #bgVideoWrap video {
      position: absolute; top: 50%; left: 50%;
      min-width: 100%; min-height: 100%;
      width: auto; height: auto;
      transform: translate(-50%, -50%);
      object-fit: cover;
    }
    .bg-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.35);
      z-index: 1;
    }

    /* ===== 导航栏 ===== */
    .navbar {
      position: sticky; top: 0; z-index: 100;
      backdrop-filter: saturate(180%) blur(24px);
      -webkit-backdrop-filter: saturate(180%) blur(24px);
      background: rgba(245,245,247,0.80);
      border-bottom: 0.5px solid rgba(0,0,0,0.08);
    }
    .navbar-inner {
      max-width: 440px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 20px; min-height: 52px;
    }
    .navbar-title {
      font-size: 17px; font-weight: 600; letter-spacing: -0.2px;
      background: linear-gradient(135deg, var(--accent), #5856d6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .navbar-badge {
      font-size: 12px; background: var(--accent); color: #fff;
      padding: 2px 10px; border-radius: 20px; font-weight: 500;
      opacity: 0; transition: opacity 0.3s;
    }
    .navbar-badge.visible { opacity: 1; }

    /* ===== 容器 ===== */
    .container {
      max-width: 440px; margin: 0 auto; padding: 16px 20px 40px;
      position: relative; z-index: 2;
    }

    /* ===== 大标题 ===== */
    .hero {
      padding: 28px 0 20px;
    }
    .hero h1 {
      font-size: 34px; font-weight: 700; letter-spacing: -0.5px;
      line-height: 1.15;
      color: #fff;
    }
    .hero h1 span { color: var(--gold); }
    .hero p {
      font-size: 15px; color: rgba(255,255,255,0.7);
      margin-top: 6px; line-height: 1.4;
    }

    /* ===== 卡片 ===== */
    .card {
      background: var(--card);
      backdrop-filter: blur(60px) saturate(180%) brightness(110%);
      -webkit-backdrop-filter: blur(60px) saturate(180%) brightness(110%);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
      border: 0.5px solid var(--card-border);
      transition: box-shadow 0.25s;
    }
    .card.hidden { display: none !important; }

    .card-label {
      font-size: 13px; font-weight: 600; color: var(--text-secondary);
      letter-spacing: 0.8px; text-transform: uppercase;
      margin-bottom: 12px;
    }

    /* ===== 品类 Tab ===== */
    .category-tabs {
      display: flex; gap: 6px; margin-bottom: 14px; overflow-x: auto;
      -webkit-overflow-scrolling: touch; scrollbar-width: none;
    }
    .category-tabs::-webkit-scrollbar { display: none; }
    .category-tab {
      flex-shrink: 0;
      padding: 8px 18px; border: none; border-radius: 20px;
      background: rgba(255,255,255,0.55);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      font-size: 14px; font-weight: 500; font-family: inherit;
      cursor: pointer; transition: all 0.2s;
      color: var(--text-secondary);
    }
    .category-tab.active {
      background: var(--accent); color: #fff; box-shadow: 0 2px 12px rgba(0,113,227,0.3);
    }
    .category-tab:active { transform: scale(0.96); }

    /* ===== 手机号登录 ===== */
    .login-card { display: block; }
    .login-card.hidden { display: none !important; }

    .phone-input-wrap {
      display: flex; gap: 8px;
    }
    .phone-input-wrap input {
      flex: 1;
      font-size: 17px; font-family: inherit;
      padding: 12px 16px; border: 1.5px solid #d2d2d7; border-radius: 12px;
      outline: none; background: rgba(255,255,255,0.9);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .phone-input-wrap input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,113,227,0.15);
    }
    .phone-input-wrap input::placeholder { color: #c7c7cc; }

    .btn-primary {
      font-size: 15px; font-weight: 600; font-family: inherit;
      padding: 12px 22px; border: none; border-radius: 12px;
      background: var(--accent); color: #fff;
      cursor: pointer; transition: background 0.2s, transform 0.1s;
      white-space: nowrap;
    }
    .btn-primary:active { transform: scale(0.97); background: var(--accent-hover); }
    .btn-primary:disabled { opacity: 0.4; cursor: default; }

    .login-tip {
      font-size: 13px; color: var(--text-secondary);
      text-align: center; margin-top: 12px;
    }
    .login-error {
      font-size: 13px; color: #ff3b30; text-align: center;
      margin-top: 8px; display: none;
    }

    /* ===== 用户栏 ===== */
    .user-bar {
      display: none; align-items: center; justify-content: space-between;
      background: var(--card); border-radius: 14px; padding: 12px 16px;
      margin-bottom: 16px; backdrop-filter: blur(60px) saturate(180%);
      border: 0.5px solid var(--card-border);
    }
    .user-bar .info { display: flex; align-items: center; gap: 8px; }
    .user-bar .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
    .user-bar .phone-label { font-size: 15px; font-weight: 500; }
    .user-bar .logout {
      font-size: 14px; color: var(--accent); cursor: pointer; font-weight: 500;
    }

    /* ===== 考点选择 ===== */
    .school-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    }
    .school-btn {
      padding: 14px 10px; border: 1.5px solid #e8e8ed; border-radius: 12px;
      background: rgba(255,255,255,0.6); font-size: 14px; font-weight: 500;
      font-family: inherit; cursor: pointer; text-align: center; line-height: 1.3;
      transition: all 0.2s; color: var(--text);
    }
    .school-btn:active { transform: scale(0.97); }
    .school-btn.selected {
      border-color: var(--accent); background: rgba(0,113,227,0.08);
      color: var(--accent);
    }

    .section-hidden { display: none !important; }

    /* ===== 花束卡片 ===== */
    .flower-list { padding-bottom: 8px; }

    .flower-card {
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 16px; overflow: hidden;
      margin-bottom: 10px; display: flex;
      cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
      border: 0.5px solid rgba(255,255,255,0.6);
    }
    .flower-card:active { transform: scale(0.98); }

    .flower-emoji {
      width: 110px; min-height: 130px;
      display: flex; align-items: center; justify-content: center;
      font-size: 50px; background: rgba(245,245,247,0.6); flex-shrink: 0;
    }
    .flower-info { flex: 1; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; }
    .flower-info .flower-name {
      font-size: 17px; font-weight: 600; letter-spacing: -0.2px;
    }
    .flower-info .flower-price {
      font-size: 18px; font-weight: 700; color: var(--accent);
    }
    .flower-info .flower-price small { font-size: 13px; font-weight: 400; color: var(--text-secondary); }
    .flower-info .flower-meta { font-size: 13px; color: var(--text-secondary); }
    .flower-info .flower-tag {
      font-size: 11px; font-weight: 600; color: #fff; background: var(--accent);
      padding: 1px 10px; border-radius: 20px; width: fit-content;
    }
    .flower-info .flower-tag.hot { background: #ff3b30; }

    /* ===== 预定表单 ===== */
    .order-form { animation: fadeSlideUp 0.35s ease; }
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .form-row {
      display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
    }
    .form-row label, .form-label {
      font-size: 15px; font-weight: 500; color: var(--text); min-width: 60px;
    }
    .form-row input, .form-row select {
      flex: 1; padding: 10px 14px; border: 1.5px solid #d2d2d7; border-radius: 10px;
      font-size: 15px; font-family: inherit; outline: none; background: rgba(255,255,255,0.9);
    }
    .form-row input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,113,227,0.12); }

    .count-control {
      display: inline-flex; align-items: center; gap: 0;
      border: 1.5px solid #d2d2d7; border-radius: 10px; overflow: hidden;
    }
    .count-control button {
      width: 40px; height: 40px; border: none; background: transparent;
      font-size: 20px; cursor: pointer; color: var(--accent); font-weight: 500;
    }
    .count-control button:active { background: #f5f5f7; }
    .count-control span {
      min-width: 36px; text-align: center; font-size: 17px; font-weight: 600;
    }

    .time-chip-grid {
      display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px;
    }
    .time-chip {
      padding: 10px 18px; border: 1.5px solid #e8e8ed; border-radius: 10px;
      background: rgba(255,255,255,0.55);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      font-size: 14px; font-family: inherit;
      cursor: pointer; transition: all 0.2s; font-weight: 500;
    }
    .time-chip:active { transform: scale(0.96); }
    .time-chip.selected {
      border-color: var(--accent); background: rgba(0,113,227,0.08); color: var(--accent);
    }

    .form-textarea {
      width: 100%; padding: 12px 14px; border: 1.5px solid #d2d2d7; border-radius: 10px;
      font-size: 15px; font-family: inherit; resize: vertical; outline: none;
      min-height: 56px; background: rgba(255,255,255,0.9); transition: border-color 0.2s;
    }
    .form-textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,113,227,0.12); }

    .btn-submit {
      width: 100%; padding: 14px; border: none; border-radius: 12px;
      background: var(--accent); color: #fff;
      font-size: 17px; font-weight: 600; font-family: inherit;
      cursor: pointer; transition: background 0.2s, transform 0.1s;
      margin-top: 8px;
      box-shadow: 0 4px 16px rgba(0,113,227,0.3);
    }
    .btn-submit:active { transform: scale(0.98); background: var(--accent-hover); }
    .btn-submit-note {
      font-size: 13px; color: var(--text-secondary); text-align: center; margin-top: 8px;
    }

    /* ===== 成功弹窗 ===== */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.25); z-index: 2000;
      align-items: center; justify-content: center;
      backdrop-filter: blur(56px);
      -webkit-backdrop-filter: blur(56px);
    }
    .modal-overlay.visible { display: flex; }
    .modal {
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(56px);
      -webkit-backdrop-filter: blur(56px);
      border-radius: 24px; padding: 32px 24px 24px;
      margin: 0 20px; max-width: 380px; width: 100%; text-align: center;
      animation: modalBounce 0.4s ease;
      border: 0.5px solid rgba(255,255,255,0.8);
    }
    @keyframes modalBounce {
      0% { transform: scale(0.92); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .modal-icon { font-size: 52px; margin-bottom: 8px; }
    .modal h3 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .modal .modal-sub { font-size: 15px; color: var(--text-secondary); margin-bottom: 16px; }
    .modal .order-summary {
      background: rgba(245,245,247,0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 14px; padding: 14px 16px;
      text-align: left; font-size: 14px; line-height: 1.8; color: var(--text);
      margin-bottom: 20px;
    }
    .modal button {
      width: 100%; padding: 14px; border: none; border-radius: 12px;
      background: var(--accent); color: #fff; font-size: 17px; font-weight: 600;
      font-family: inherit; cursor: pointer;
    }
    .modal button:active { opacity: 0.85; }

    /* ===== 通知条 ===== */
    .notice-bar {
      display: none;
      position: relative;
      max-width: 440px; margin: 0 auto 12px;
      background: rgba(255,255,255,0.78);
      backdrop-filter: blur(40px) saturate(180%);
      -webkit-backdrop-filter: blur(40px) saturate(180%);
      border-radius: 12px;
      padding: 10px 36px 10px 14px;
      border: 0.5px solid rgba(255,255,255,0.9);
      overflow: hidden;
    }
    .notice-bar.visible { display: block; }
    .notice-scroll {
      height: 22px; overflow: hidden; position: relative;
    }
    .notice-scroll-inner {
      position: absolute; width: 100%;
      animation: noticeScroll 10s linear infinite;
    }
    .notice-scroll-inner div {
      height: 22px; line-height: 22px;
      font-size: 13px; color: var(--text-secondary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    @keyframes noticeScroll {
      0% { transform: translateY(0); }
      100% { transform: translateY(-50%); }
    }
    .notice-close {
      position: absolute; top: 8px; right: 10px;
      background: none; border: none; font-size: 16px;
      color: var(--text-secondary); cursor: pointer; padding: 2px; line-height: 1;
    }
    .notice-close:hover { color: var(--text); }

    /* ===== 管理入口 ===== */
    .admin-entry {
      position: fixed; bottom: 20px; right: 20px;
      width: 52px; height: 52px;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 20px rgba(0,0,0,0.08);
      cursor: pointer; font-size: 24px; z-index: 100;
      border: 0.5px solid rgba(255,255,255,0.6);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .admin-entry:active { transform: scale(0.92); box-shadow: 0 1px 10px rgba(0,0,0,0.08); }

    @media (max-width: 380px) {
      .hero h1 { font-size: 28px; }
      .school-grid { grid-template-columns: 1fr; }
      .flower-emoji { width: 90px; font-size: 40px; }
    }
  </style>
</head>
<body>

<!-- 全屏视频背景 -->
<div id="bgVideoWrap">
  <video id="bgVideo" autoplay loop muted playsinline preload="auto" poster="sunflower-poster.jpg">
    <source src="flower-bg.mp4" type="video/mp4">
  </video>
</div>
<div class="bg-overlay"></div>

<!-- 导航栏 -->
<div class="navbar">
  <div class="navbar-inner">
    <div class="navbar-title">🌸 中考加油</div>
    <div class="navbar-badge" id="navbarBadge">已登录</div>
  </div>
</div>

<!-- 通知条 -->
<div class="notice-bar" id="noticeBar">
  <div class="notice-scroll" id="noticeScroll">
    <div class="notice-scroll-inner" id="noticeInner"></div>
  </div>
  <button class="notice-close" id="noticeClose">✕</button>
</div>

<div class="container">

  <!-- 大标题区 -->
  <div class="hero">
    <h1>为孩子<br>送一束 <span>祝福</span></h1>
    <p>扫码预定 · 考场门口取花 · 金榜题名</p>
  </div>

  <!-- ===== 登录卡 ===== -->
  <div class="card login-card" id="loginCard">
    <div class="card-label">登录</div>
    <div class="phone-input-wrap">
      <input type="tel" id="phoneInput" placeholder="手机号" maxlength="11" inputmode="numeric">
      <button class="btn-primary" id="loginBtn">继续</button>
    </div>
    <div class="login-error" id="loginError">请输入 11 位手机号</div>
    <div class="login-tip">用于取花时核对订单 · 信息仅本地保存</div>
  </div>

  <!-- ===== 用户栏 ===== -->
  <div class="user-bar" id="userBar">
    <div class="info">
      <span class="dot"></span>
      <span class="phone-label" id="displayPhone"></span>
    </div>
    <span class="logout" id="logoutBtn">退出</span>
  </div>

  <!-- ===== 选择考点 ===== -->
  <div class="card section-hidden" id="schoolCard">
    <div class="card-label">选择考点</div>
    <div class="school-grid">
      <button class="school-btn" data-school="金华市第十五中学">金华市第十五中学</button>
      <button class="school-btn" data-school="金华市第五中学">金华市第五中学</button>
      <button class="school-btn" data-school="金华市南苑中学">金华市南苑中学</button>
      <button class="school-btn" data-school="义乌稠州中学">义乌稠州中学</button>
      <button class="school-btn" data-school="绣湖中学">绣湖中学</button>
    </div>
  </div>

  <!-- ===== 品类切换 + 花束列表 ===== -->
  <div class="section-hidden" id="flowersSection">

    <!-- 品类 Tab -->
    <div class="category-tabs" id="categoryTabs"></div>

    <div class="flower-list" id="flowerList"></div>

    <!-- ===== 预定表单 ===== -->
    <div class="card order-form section-hidden" id="orderForm">
      <div class="card-label">确认订单</div>

      <div style="margin-bottom:12px;">
        <span style="font-size:15px;font-weight:600;">¥<span id="selectedFlowerPrice"></span></span>
        <span style="font-size:15px;font-weight:600;margin-left:4px;" id="selectedFlowerName"></span>
      </div>

      <div class="form-row">
        <label>数量</label>
        <div class="count-control">
          <button id="countMinus">−</button>
          <span id="countDisplay">1</span>
          <button id="countPlus">+</button>
        </div>
      </div>

      <div class="form-label" style="margin-bottom:6px;">取花时段</div>
      <div class="time-chip-grid">
        <button class="time-chip" data-time="上午场 10:00–11:00">上午 10–11点</button>
        <button class="time-chip" data-time="下午场 15:00–16:00">下午 3–4点</button>
        <button class="time-chip" data-time="散场后 17:00–18:00">散场 5–6点</button>
      </div>

      <div class="form-row">
        <label>称呼</label>
        <input type="text" id="orderName" placeholder="张妈妈 / 李同学（选填）">
      </div>

      <div class="form-label" style="margin-bottom:6px;">祝福语（选填）</div>
      <textarea class="form-textarea" id="orderMessage" placeholder="写一句祝福送给考生吧 ✨"></textarea>

      <button class="btn-submit" id="submitBtn">提交预定</button>
      <div class="btn-submit-note">到摊位报手机号取花 · 到付即可</div>
    </div>

  </div>

</div>

<!-- ===== 成功弹窗 ===== -->
<div class="modal-overlay" id="successModal">
  <div class="modal">
    <div class="modal-icon">🎉</div>
    <h3>预定成功</h3>
    <p class="modal-sub">到考场门口摊位报手机号取花</p>
    <div class="order-summary" id="orderDetail"></div>
    <button id="modalBtn">继续选花</button>
  </div>
</div>

<!-- 管理入口 -->
<a class="admin-entry" href="admin.html" title="管理看板">📊</a>

<script>
// ==================== 数据 ====================
const FLOWERS = {
  flowers: {
    flower1: { name: '一举夺魁 · 大', price: 39, emoji: '🌻', meta: '3枝向日葵 · 黄莺 · 精美包装', tag: '🔥 家长最爱', hot: true },
    flower2: { name: '一举夺魁 · 小', price: 19, emoji: '🌻', meta: '1枝向日葵 · 简约包装', tag: '💛 随手心意', hot: false },
    flower3: { name: '前程似锦', price: 59, emoji: '💐', meta: '向日葵 · 香槟玫瑰 · 满天星混搭', tag: '⭐ 进阶之选', hot: false },
    flower4: { name: '金榜题名', price: 69, emoji: '🌹', meta: '9枝红玫瑰 · 尤加利叶 · 礼盒包装', tag: '🏆 仪式感满分', hot: false },
    flower5: { name: '感恩师恩', price: 49, emoji: '🏵️', meta: '康乃馨混搭 · 配草', tag: '🙏 送给老师', hot: false },
  },
  snacks: {
    snack1: { name: '零食大礼花束', price: 45, emoji: '🍫', meta: '薯片 · 糖果 · 巧克力混搭花束', tag: '🎁 可爱满分', hot: false },
    snack2: { name: '甜蜜冲刺筒', price: 35, emoji: '🍭', meta: '棒棒糖 · 小熊软糖 · 饼干筒', tag: '🍬 甜甜的', hot: false },
    snack3: { name: '学霸能量包', price: 55, emoji: '⚡', meta: '功能饮料 · 坚果 · 巧克力能量包', tag: '🔋 补充能量', hot: false },
  },
  knit: {
    knit1: { name: '向日葵针织花', price: 39, emoji: '🧶', meta: '手工钩织向日葵 · 不会凋谢', tag: '♻️ 永久保存', hot: false },
    knit2: { name: '玫瑰针织礼盒', price: 59, emoji: '🌷', meta: '礼盒装针织玫瑰 · 精美包装', tag: '🎀 送礼佳品', hot: false },
  },
};

const CATEGORY_LABELS = {
  flowers: { name: '💐 鲜花', icon: '💐' },
  snacks: { name: '🍭 零食花', icon: '🍭' },
  knit: { name: '🧶 针织花', icon: '🧶' },
};

let currentCategory = 'flowers';

// ==================== 状态 ====================
let loginPhone = '';
let selectedSchool = '';
let selectedFlower = null;
let orderCount = 1;
let selectedTime = '';
let currentOrders = [];

// ==================== DOM ====================
const $ = id => document.getElementById(id);

const loginCard = $('loginCard');
const phoneInput = $('phoneInput');
const loginBtn = $('loginBtn');
const loginError = $('loginError');
const userBar = $('userBar');
const displayPhone = $('displayPhone');
const logoutBtn = $('logoutBtn');
const schoolCard = $('schoolCard');
const schoolBtns = document.querySelectorAll('.school-btn');
const flowersSection = $('flowersSection');
const categoryTabs = $('categoryTabs');
const flowerList = $('flowerList');
const orderForm = $('orderForm');
const selectedFlowerName = $('selectedFlowerName');
const selectedFlowerPrice = $('selectedFlowerPrice');
const countDisplay = $('countDisplay');
const countMinus = $('countMinus');
const countPlus = $('countPlus');
const orderName = $('orderName');
const timeChips = document.querySelectorAll('.time-chip');
const orderMessage = $('orderMessage');
const submitBtn = $('submitBtn');
const successModal = $('successModal');
const orderDetail = $('orderDetail');
const modalBtn = $('modalBtn');
const navbarBadge = $('navbarBadge');
const noticeBar = $('noticeBar');
const noticeInner = $('noticeInner');
const noticeClose = $('noticeClose');

// ==================== 品类渲染 ====================
function renderCategoryTabs() {
  categoryTabs.innerHTML = Object.entries(CATEGORY_LABELS).map(([key, val]) =>
    `<button class="category-tab ${key === currentCategory ? 'active' : ''}" data-cat="${key}">${val.name}</button>`
  ).join('');
  categoryTabs.querySelectorAll('.category-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      currentCategory = tab.dataset.cat;
      categoryTabs.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      renderFlowers();
      orderForm.classList.add('section-hidden');
    });
  });
}

function renderFlowers() {
  const items = FLOWERS[currentCategory];
  if (!items) return;
  flowerList.innerHTML = Object.entries(items).map(([id, f]) =>
    `<div class="flower-card" data-id="${id}" data-name="${f.name}" data-price="${f.price}">
      <div class="flower-emoji">${f.emoji}</div>
      <div class="flower-info">
        <div class="flower-name">${f.name}</div>
        <div class="flower-price">¥${f.price} <small>/ 份</small></div>
        <div class="flower-meta">${f.meta}</div>
        <div class="flower-tag${f.hot ? ' hot' : ''}">${f.tag}</div>
      </div>
    </div>`
  ).join('');
  flowerList.querySelectorAll('.flower-card').forEach(card => {
    card.addEventListener('click', () => {
      if (!selectedSchool) { alert('请先选择考点'); return; }
      const flower = FLOWERS[currentCategory][card.dataset.id];
      if (!flower) return;
      selectedFlower = card.dataset.id;
      selectedFlowerName.textContent = flower.name;
      selectedFlowerPrice.textContent = flower.price;
      orderCount = 1;
      countDisplay.textContent = '1';
      selectedTime = '';
      timeChips.forEach(c => c.classList.remove('selected'));
      orderForm.classList.remove('section-hidden');
      setTimeout(() => orderForm.scrollIntoView({ behavior: 'smooth', block: 'center' }), 50);
    });
  });
}

// ==================== 数据持久化 ====================
function loadOrders() {
  try {
    const data = localStorage.getItem('zkf_orders_v2');
    currentOrders = data ? JSON.parse(data) : [];
  } catch { currentOrders = []; }
}
function saveOrders() {
  localStorage.setItem('zkf_orders_v2', JSON.stringify(currentOrders));
}
loadOrders();

function restoreLogin() {
  const saved = localStorage.getItem('zkf_phone_v2');
  if (saved) {
    loginPhone = saved;
    showLoggedIn();
  }
}

// ==================== 通知条 ====================
function renderNotices() {
  if (!loginPhone) return;
  const savedClose = localStorage.getItem('zkf_notice_closed');
  if (savedClose) return;

  // Try fetching from API first
  fetch('/api/notices')
    .then(r => r.json())
    .then(notices => {
      if (!notices || notices.length === 0) { noticeBar.classList.remove('visible'); return; }
      const items = notices.map(n => `<div>📢 ${n.phone} 预定了 ${n.flowerName}</div>`);
      // Duplicate for seamless scroll
      noticeInner.innerHTML = items.join('') + items.join('');
      const speed = Math.max(6, 12 - notices.length);
      noticeInner.style.animationDuration = speed + 's';
      noticeBar.classList.add('visible');
    })
    .catch(() => {
      // Fallback to local orders
      const localNotices = currentOrders.slice(-12).reverse().map(o => ({
        phone: o.phone ? o.phone.slice(0,3) + '****' + o.phone.slice(-4) : '***',
        flowerName: o.flowerName
      }));
      if (localNotices.length === 0) { noticeBar.classList.remove('visible'); return; }
      const items = localNotices.map(n => `<div>📢 ${n.phone} 预定了 ${n.flowerName}</div>`);
      noticeInner.innerHTML = items.join('') + items.join('');
      noticeBar.classList.add('visible');
    });
}

// ==================== 登录逻辑 ====================
function showLoggedIn() {
  loginCard.classList.add('hidden');
  userBar.style.display = 'flex';
  displayPhone.textContent = loginPhone.slice(0,3) + '****' + loginPhone.slice(-4);
  schoolCard.classList.remove('section-hidden');
  schoolCard.style.display = 'block';
  navbarBadge.classList.add('visible');
  renderCategoryTabs();
  renderFlowers();
  renderNotices();
}

loginBtn.addEventListener('click', () => {
  const phone = phoneInput.value.trim();
  if (!/^1\d{10}$/.test(phone)) {
    loginError.style.display = 'block';
    return;
  }
  loginError.style.display = 'none';
  loginPhone = phone;
  localStorage.setItem('zkf_phone_v2', phone);
  showLoggedIn();
});

phoneInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') loginBtn.click();
});

logoutBtn.addEventListener('click', () => {
  loginPhone = '';
  localStorage.removeItem('zkf_phone_v2');
  userBar.style.display = 'none';
  schoolCard.classList.add('section-hidden');
  schoolCard.style.display = 'none';
  flowersSection.classList.add('section-hidden');
  flowersSection.style.display = 'none';
  orderForm.classList.add('section-hidden');
  orderForm.style.display = 'none';
  selectedSchool = '';
  selectedFlower = null;
  schoolBtns.forEach(b => b.classList.remove('selected'));
  loginCard.classList.remove('hidden');
  loginCard.style.display = 'block';
  phoneInput.value = '';
  navbarBadge.classList.remove('visible');
  noticeBar.classList.remove('visible');
  localStorage.removeItem('zkf_notice_closed');
});

// ==================== 考点 ====================
schoolBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    schoolBtns.forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedSchool = btn.dataset.school;
    flowersSection.classList.remove('section-hidden');
    flowersSection.style.display = 'block';
  });
});

// ==================== 数量 ====================
countMinus.addEventListener('click', () => {
  if (orderCount > 1) { orderCount--; countDisplay.textContent = orderCount; }
});
countPlus.addEventListener('click', () => {
  if (orderCount < 99) { orderCount++; countDisplay.textContent = orderCount; }
});

// ==================== 时段 ====================
timeChips.forEach(chip => {
  chip.addEventListener('click', () => {
    timeChips.forEach(c => c.classList.remove('selected'));
    chip.classList.add('selected');
    selectedTime = chip.dataset.time;
  });
});

// ==================== 提交 ====================
submitBtn.addEventListener('click', async () => {
  if (!selectedSchool) { alert('请选择考点'); return; }
  if (!selectedFlower) { alert('请选择花束'); return; }
  if (!selectedTime) { alert('请选择取花时段'); return; }

  const catItems = FLOWERS[currentCategory];
  const flower = catItems ? catItems[selectedFlower] : null;
  if (!flower) { alert('花束信息出错'); return; }

  const total = flower.price * orderCount;

  const order = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    phone: loginPhone,
    school: selectedSchool,
    flowerName: flower.name,
    flowerPrice: flower.price,
    count: orderCount,
    total,
    time: selectedTime,
    name: orderName.value.trim() || '未填写',
    message: orderMessage.value.trim() || '无',
  };

  // 同步到后端 API
  try {
    const res = await fetch('/api/order', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(order),
    });
    const json = await res.json();
    if (!json.ok) throw new Error('提交失败');
  } catch (e) {
    console.warn('后端同步失败，订单仅保存在本地', e);
  }

  // 本地保存
  currentOrders.push({ ...order, createdAt: new Date().toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai' }), taken: false });
  saveOrders();

  orderDetail.innerHTML = `
    📍 考点：${order.school}<br>
    💐 ${order.flowerName} × ${order.count}<br>
    💰 ¥${order.total}（到付）<br>
    ⏰ ${order.time}<br>
    📞 ${order.phone}
  `;
  successModal.classList.add('visible');

  orderForm.classList.add('section-hidden');
  orderForm.style.display = 'none';
  selectedFlower = null;
  orderName.value = '';
  orderMessage.value = '';
  timeChips.forEach(c => c.classList.remove('selected'));
  selectedTime = '';
});

modalBtn.addEventListener('click', () => successModal.classList.remove('visible'));
successModal.addEventListener('click', (e) => {
  if (e.target === successModal) successModal.classList.remove('visible');
});

// ==================== 通知条关闭 ====================
noticeClose.addEventListener('click', () => {
  noticeBar.classList.remove('visible');
  localStorage.setItem('zkf_notice_closed', '1');
});

// ==================== 初始化 ====================
restoreLogin();
</script>
</body>
</html>
